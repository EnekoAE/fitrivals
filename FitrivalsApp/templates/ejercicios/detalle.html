{% extends 'base.html' %}

{% block title %}{{ ejercicio.nombre }} | Fit Rivals{% endblock %}

{% block content %}
    <div class="hero-card">
        <span class="badge-orange">{{ ejercicio.grupo_muscular }}</span>
        <h1>{{ ejercicio.nombre }}</h1>

        <div class="meta-datos">
            <span><strong>Grupo Muscular:</strong> {{ ejercicio.grupo_muscular }}</span>
            <span><strong>Dificultad:</strong> {{ ejercicio.dificultad }}</span>
        </div>
    </div>

    <div class="detalle-acciones">
        <a href="{% url 'lista_ejercicios' %}" class="btn-secondary-strava">← Volver al Catálogo</a>
    </div>
{% endblock %}
