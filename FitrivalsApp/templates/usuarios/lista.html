<!DOCTYPE html>
<html lang="es">
<head><title>Lista de Usuarios</title></head>
<body>
    <h1>Usuarios Registrados</h1>
    <p><a href="{% url 'index' %}">← Volver al Índice</a></p>
    <ul>
        {% for usuario in usuarios %}
            <li>
                <a href="{% url 'detalle_usuario' usuario.pk %}">{{ usuario.nombre }}</a> 
                ({{ usuario.puntos }} pts)
            </li>
        {% empty %}
            <li>No hay usuarios registrados.</li>
        {% endfor %}
    </ul>
</body>
</html>
