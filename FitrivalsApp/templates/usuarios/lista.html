<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - FitRivals</title>
</head>
<body>
    <a href="{% url 'index' %}">Inicio</a>
    <h1>Usuarios</h1>

    <table border="1">
        <tr><th>Nombre</th><th>Email</th><th>Puntos</th></tr>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.nombre }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.puntos }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No hay usuarios.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
