<!DOCTYPE html>
<html lang="es">
<head><title>Lista de Entrenamientos</title></head>
<body>
    <h1>Historial de Entrenamientos</h1>
    <p><a href="{% url 'index' %}">← Volver al Índice</a></p>
    <ul>
        {% for entrenamiento in entrenamientos %}
            <li>
                <a href="{% url 'detalle_entrenamiento' entrenamiento.pk %}">
                    {{ entrenamiento.fecha }} - {{ entrenamiento.usuario.nombre }}
                </a> 
                ({{ entrenamiento.duracion_minutos }} min)
            </li>
        {% empty %}
            <li>No hay entrenamientos registrados.</li>
        {% endfor %}
    </ul>
</body>
</html>
